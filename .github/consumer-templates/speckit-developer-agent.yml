# SpecKit Developer Agent — thin entrypoint: dispatches the reusable runner (bootstrap, prepare, Codex, teardown).
# Copy to `.github/workflows/` and adjust `config_file` if your agent JSON lives elsewhere.
#
# Required secrets: COPILOT_PAT, OPENAI_API_KEY
name: SpecKit Developer Agent
run-name: ${{ inputs.mode == 'fix' && format('SpecKit Developer Agent — Fix (PR {0})', inputs.pr_number) || format('{0} · SpecKit Developer Agent ({1})', inputs.issue_key, inputs.step) }}

concurrency:
  group: speckit-developer-agent-${{ inputs.mode == 'fix' && format('fix-pr-{0}', inputs.pr_number) || inputs.issue_key }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "speckit — spec-kit pipeline; fix — /fix (issue_key + pr_number + prompt + branch_name)"
        required: false
        type: string
        default: 'speckit'
      issue_number:
        description: "GitHub issue number (mode=speckit)"
        required: false
        type: string
        default: ''
      issue_key:
        description: "Jira issue key (speckit and fix — required; /fix handler resolves from PR label or speckit-state)"
        required: false
        type: string
        default: ''
      step:
        description: "Spec-kit step (mode=speckit)"
        required: false
        type: string
        default: ''
      branch_name:
        description: "Git ref for checkout. specify: optional before bootstrap; other steps / fix: feature branch or PR head."
        required: false
        type: string
        default: ''
      pr_number:
        description: "PR number (mode=fix). mode=speckit: optional; if set with specify, skips bootstrap (set branch_name)."
        required: false
        type: string
        default: ''
      prompt:
        description: "mode=fix: /fix comment (+ optional HIL). mode=speckit: optional path or text after codex prepare. See SDLCAgents reusable docs."
        required: false
        type: string
        default: ''

jobs:
  agent:
    name: SpecKit Developer Agent
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: DmitryLukyanov/SDLCAgents/.github/workflows/_reusable-speckit-developer-agent.yml@master
    with:
      mode: ${{ inputs.mode }}
      issue_number: ${{ inputs.issue_number }}
      issue_key: ${{ inputs.issue_key }}
      step: ${{ inputs.step }}
      branch_name: ${{ inputs.branch_name }}
      fix_pr_number: ${{ inputs.pr_number }}
      speckit_pr_number: ${{ inputs.pr_number }}
      prompt: ${{ inputs.prompt }}
      config_file: config/workflows/speckit-developer-agent/speckit-developer-agent.config
    secrets: inherit
