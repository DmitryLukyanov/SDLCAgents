# Reusable job workflow: checkout consumer repo, optional artifact download,
# optional inline prompt materialization, `openai/codex-action@v1`, optional
# commit+push of workspace changes, then upload artifact(s).
#
# After Codex, two extra single-file artifacts are always uploaded when the prompt was resolved:
#   • codex_input_<upload_artifact_name> — the prompt file passed to codex-action
#   • codex_output_<upload_artifact_name> — Codex output file (skipped if missing, e.g. hard failure before write)
#
# Optional `checkout_ref` + secret `COPILOT_PAT`: checkout a feature branch (e.g. workflow_dispatch
# where GITHUB_REF is not the branch Codex should run on).
#
# Optional `commit_workspace_after_codex`: after a successful Codex run, stage changes with
# `git add -u` + untracked (respecting .gitignore), skip `.sdlc-agents/` except `extra_git_add_paths`,
# never stage `node_modules`, then commit with `workspace_commit_message` and push to `checkout_ref`.
# Used by Developer Agent so teardown only updates state / PR metadata.
#
# Prompt (exactly one — XOR):
#   • prompt_file — non-empty path to an existing file after checkout/download (passed to codex-action).
#   • prompt_content — non-empty inline text; written to `.sdlc-agents/codex-prompt-from-workflow-input.md`
#     before Codex (prompt_file must be empty). Do not set both.
#
# Used by other SDLCAgents reusable workflows (same repo) via:
#   uses: ./.github/workflows/_reusable-codex-run.yml
#
# Paths are relative to the consumer repository root (the checked-out workspace).
name: "[Reusable] Codex run"

on:
  workflow_call:
    inputs:
      config:
        description: "JSON object containing all configuration parameters for the Codex run"
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
      COPILOT_PAT:
        description: "Required when checkout_ref is set (private repo / non-default ref); used to push after workspace commit"
        required: false

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.config).timeout_minutes || 20 }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - name: Parse JSON config and set variables
        id: parse_config
        shell: bash
        run: |
          set -euo pipefail

          # Parse JSON config
          CONFIG='${{ inputs.config }}'

          # Extract all parameters with defaults
          download_artifact_name=$(echo "$CONFIG" | jq -r '.download_artifact_name // ""')
          download_path=$(echo "$CONFIG" | jq -r '.download_path // "."')
          prompt_file=$(echo "$CONFIG" | jq -r '.prompt_file // ""')
          prompt_content=$(echo "$CONFIG" | jq -r '.prompt_content // ""')
          output_file=$(echo "$CONFIG" | jq -r '.output_file')
          upload_artifact_name=$(echo "$CONFIG" | jq -r '.upload_artifact_name')
          upload_path=$(echo "$CONFIG" | jq -r '.upload_path')
          upload_if_no_files_found=$(echo "$CONFIG" | jq -r '.upload_if_no_files_found // "ignore"')
          model=$(echo "$CONFIG" | jq -r '.model // ""')
          codex_step_name=$(echo "$CONFIG" | jq -r '.codex_step_name // "Run Codex"')
          checkout_ref=$(echo "$CONFIG" | jq -r '.checkout_ref // ""')
          commit_workspace_after_codex=$(echo "$CONFIG" | jq -r '.commit_workspace_after_codex // false')
          workspace_commit_message=$(echo "$CONFIG" | jq -r '.workspace_commit_message // ""')
          git_commit_user_email=$(echo "$CONFIG" | jq -r '.git_commit_user_email // "speckit-developer-agent@sdlc-agents.bot"')
          git_commit_user_name=$(echo "$CONFIG" | jq -r '.git_commit_user_name // "SDLC SpecKit Developer Agent"')
          extra_git_add_paths=$(echo "$CONFIG" | jq -r '.extra_git_add_paths // ""')

          # Set model default
          if [ -z "$model" ]; then model="o4-mini"; fi

          # Output all variables
          echo "download_artifact_name=$download_artifact_name" >> "$GITHUB_OUTPUT"
          echo "download_path=$download_path" >> "$GITHUB_OUTPUT"
          echo "prompt_file=$prompt_file" >> "$GITHUB_OUTPUT"
          {
            echo "prompt_content<<__PROMPT_CONTENT_EOF__"
            echo "$prompt_content"
            echo "__PROMPT_CONTENT_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "output_file=$output_file" >> "$GITHUB_OUTPUT"
          echo "upload_artifact_name=$upload_artifact_name" >> "$GITHUB_OUTPUT"
          echo "upload_path=$upload_path" >> "$GITHUB_OUTPUT"
          echo "upload_if_no_files_found=$upload_if_no_files_found" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "codex_step_name=$codex_step_name" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "commit_workspace_after_codex=$commit_workspace_after_codex" >> "$GITHUB_OUTPUT"
          echo "workspace_commit_message=$workspace_commit_message" >> "$GITHUB_OUTPUT"
          echo "git_commit_user_email=$git_commit_user_email" >> "$GITHUB_OUTPUT"
          echo "git_commit_user_name=$git_commit_user_name" >> "$GITHUB_OUTPUT"
          {
            echo "extra_git_add_paths<<__EXTRA_PATHS_EOF__"
            echo "$extra_git_add_paths"
            echo "__EXTRA_PATHS_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Log model to GitHub Summary
        run: |
          {
            echo "## Codex Configuration"
            echo ""
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| **Model** | \`${{ steps.parse_config.outputs.model }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create workflow inputs JSON artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workflow-inputs-artifact
          cat > workflow-inputs-artifact/codex_workflow_inputs.json <<'EOF'
          ${{ inputs.config }}
          EOF
          echo "Codex workflow inputs captured to artifact:"
          cat workflow-inputs-artifact/codex_workflow_inputs.json

      - name: Upload workflow inputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-workflow-inputs-${{ github.run_id }}
          path: workflow-inputs-artifact/
          if-no-files-found: error

      - name: Checkout consumer repo
        if: ${{ steps.parse_config.outputs.checkout_ref == '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout consumer repo (explicit ref)
        if: ${{ steps.parse_config.outputs.checkout_ref != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.parse_config.outputs.checkout_ref }}
          token: ${{ secrets.COPILOT_PAT }}

      - name: Download workspace for Codex
        if: ${{ steps.parse_config.outputs.download_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.parse_config.outputs.download_artifact_name }}
          path: ${{ steps.parse_config.outputs.download_path }}

      - name: Resolve prompt path (exactly one of prompt_file or prompt_content)
        id: resolve_prompt
        env:
          IN_FILE: ${{ steps.parse_config.outputs.prompt_file }}
        run: |
          set -euo pipefail
          # Booleans expanded by Actions (true/false) — avoid env coercion quirks.
          HAS_FILE=${{ steps.parse_config.outputs.prompt_file != '' }}
          HAS_CONTENT=${{ steps.parse_config.outputs.prompt_content != '' }}
          DEFAULT='.sdlc-agents/codex-prompt-from-workflow-input.md'
          if [ "$HAS_FILE" = "true" ] && [ "$HAS_CONTENT" = "true" ]; then
            echo '::error::Set only one of prompt_file (existing path) or prompt_content (inline text), not both.'
            exit 1
          fi
          if [ "$HAS_FILE" != "true" ] && [ "$HAS_CONTENT" != "true" ]; then
            echo '::error::Provide exactly one of: prompt_file (non-empty path) or prompt_content (non-empty text).'
            exit 1
          fi
          if [ "$HAS_CONTENT" = "true" ]; then
            echo 'prompt_path<<__PROMPT_PATH_EOF__' >> "$GITHUB_OUTPUT"
            printf '%s\n' "$DEFAULT" >> "$GITHUB_OUTPUT"
            echo __PROMPT_PATH_EOF__ >> "$GITHUB_OUTPUT"
            echo 'mode=content' >> "$GITHUB_OUTPUT"
          else
            echo 'prompt_path<<__PROMPT_PATH_EOF__' >> "$GITHUB_OUTPUT"
            printf '%s\n' "$IN_FILE" >> "$GITHUB_OUTPUT"
            echo __PROMPT_PATH_EOF__ >> "$GITHUB_OUTPUT"
            echo 'mode=file' >> "$GITHUB_OUTPUT"
          fi

      - name: Write prompt from prompt_content
        if: steps.resolve_prompt.outputs.mode == 'content'
        env:
          PROMPT_PATH: ${{ steps.resolve_prompt.outputs.prompt_path }}
          PROMPT_CONTENT: ${{ steps.parse_config.outputs.prompt_content }}
        run: |
          set -euo pipefail
          python3 -c "import os, pathlib; p=pathlib.Path(os.environ['PROMPT_PATH']); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(os.environ['PROMPT_CONTENT'], encoding='utf-8')"
          echo "Wrote inline prompt to $PROMPT_PATH ($(wc -c < "$PROMPT_PATH" | tr -d ' ') bytes)"

      - name: Ensure prompt file exists
        env:
          PROMPT_PATH: ${{ steps.resolve_prompt.outputs.prompt_path }}
        run: |
          set -euo pipefail
          if [ ! -f "$PROMPT_PATH" ]; then
            echo "::error::Prompt file missing: $PROMPT_PATH"
            exit 1
          fi

      - name: ${{ steps.parse_config.outputs.codex_step_name }}
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ steps.resolve_prompt.outputs.prompt_path }}
          sandbox: workspace-write
          model: ${{ steps.parse_config.outputs.model }}
          output-file: ${{ steps.parse_config.outputs.output_file }}
          allow-bots: true

      - name: Upload Codex input prompt artifact
        if: always() && steps.resolve_prompt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: codex_input_${{ steps.parse_config.outputs.upload_artifact_name }}
          path: ${{ steps.resolve_prompt.outputs.prompt_path }}
          if-no-files-found: error

      - name: Upload Codex output artifact
        if: always() && steps.resolve_prompt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: codex_output_${{ steps.parse_config.outputs.upload_artifact_name }}
          path: ${{ steps.parse_config.outputs.output_file }}
          if-no-files-found: ignore

      - name: Commit and push workspace changes after Codex
        if: success() && steps.parse_config.outputs.commit_workspace_after_codex == 'true'
        env:
          COMMIT_MSG: ${{ steps.parse_config.outputs.workspace_commit_message }}
          GIT_USER_EMAIL: ${{ steps.parse_config.outputs.git_commit_user_email }}
          GIT_USER_NAME: ${{ steps.parse_config.outputs.git_commit_user_name }}
          BRANCH: ${{ steps.parse_config.outputs.checkout_ref }}
          EXTRA_PATHS: ${{ steps.parse_config.outputs.extra_git_add_paths }}
          CODEX_OUTPUT_FILE: ${{ steps.parse_config.outputs.output_file }}
        run: |
          set -euo pipefail
          if [ -z "${COMMIT_MSG// }" ]; then
            echo '::error::workspace_commit_message is required when commit_workspace_after_codex is true'
            exit 1
          fi
          if [ -z "${BRANCH// }" ]; then
            echo '::error::checkout_ref must be set when commit_workspace_after_codex is true'
            exit 1
          fi
          git config user.email "$GIT_USER_EMAIL"
          git config user.name "$GIT_USER_NAME"

          # Sync modified consumer templates from .sdlc-agents subdirectory to root
          # (Codex may modify files in .sdlc-agents which are excluded from commit)
          if [ -d ".sdlc-agents/.github/consumer-templates" ] && [ -d ".github/consumer-templates" ]; then
            echo "Checking for modified consumer templates in .sdlc-agents..."
            while IFS= read -r -d '' src_file; do
              rel_path="${src_file#.sdlc-agents/}"
              dest_file="$rel_path"
              # Only copy if the file was modified (different from root copy)
              if [ -f "$dest_file" ]; then
                if ! cmp -s "$src_file" "$dest_file"; then
                  echo "  Syncing modified: $rel_path"
                  cp "$src_file" "$dest_file"
                fi
              fi
            done < <(find .sdlc-agents/.github/consumer-templates -type f -name "*.yml" -print0)
          fi

          # Do not use `git add -A` + pathspec excludes: nested `**/node_modules` is easy to miss and
          # Git then tries to stage ignored trees and aborts ("ignored by .gitignore").
          git add -u
          while IFS= read -r -d '' f; do
            case "$f" in
              .sdlc-agents/*|.sdlc-agents) continue ;;
            esac
            git add -- "$f"
          done < <(git ls-files -z --others --exclude-standard)
          git diff --cached --name-only -z \
            | { grep -zE '(^|/)node_modules(/|$)' || true; } \
            | while IFS= read -r -d '' p; do
              [ -z "$p" ] && continue
              git restore --staged -- "$p" || true
            done
          if [ -n "${EXTRA_PATHS:-}" ]; then
            printf '%s\n' "$EXTRA_PATHS" | while IFS= read -r line || [ -n "$line" ]; do
              [ -z "${line// }" ] && continue
              if [ -f "$line" ]; then git add -f "$line"; fi
            done
          fi
          if git diff --cached --quiet; then
            echo "No Codex workspace changes to commit"
            exit 0
          fi
          git commit -m "$COMMIT_MSG"
          git push origin "HEAD:refs/heads/$BRANCH"
          SHA="$(git rev-parse HEAD)"

          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          {
            echo "## Workspace commit (Codex)"
            echo ""
            echo "Created commit [\`${SHA:0:7}\`](${REPO_URL}/commit/${SHA}) on \`${BRANCH}\`."
            echo ""
            echo "### Files in this commit"
            echo ""
            echo "| File | Size |"
            echo "|------|------|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if [ -f "$p" ]; then
              sz=$(wc -c < "$p" | tr -d ' ')
              echo "| \`$p\` | ${sz} B |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$p\` | — |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(git show --pretty="" --name-only HEAD)
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${CODEX_OUTPUT_FILE:-}" ] && [ -f "$CODEX_OUTPUT_FILE" ]; then
            {
              echo "<details><summary>Codex CLI output</summary>"
              echo ""
              echo '```'
              cat "$CODEX_OUTPUT_FILE"
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Codex workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.parse_config.outputs.upload_artifact_name }}
          path: ${{ steps.parse_config.outputs.upload_path }}
          if-no-files-found: ${{ steps.parse_config.outputs.upload_if_no_files_found }}
