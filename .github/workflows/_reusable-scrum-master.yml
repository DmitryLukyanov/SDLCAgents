# Reusable Scrum Master workflow.
# Checks out the calling (consumer) repo for config, SDLCAgents for Node scripts.
#
# Usage in consumer repo:
#   jobs:
#     call:
#       uses: DmitryLukyanov/SDLCAgents/.github/workflows/_reusable-scrum-master.yml@master
#       with:
#         jira_project: MY-PROJECT   # optional: replaces {jiraProject} in step JQL in scrum-master.config
#       secrets: inherit
# JQL, workflow paths, and per-step Jira status filter / post-dispatch status are read from
# config/workflows/scrum-master/scrum-master.config (PIPELINE_CONFIG_FILE or RULES_FILE): pipeline steps `sm_dispatch_rule` may set requiredJiraStatus, postReadStatus.
# Entry workflows are always dispatched at git ref **master** (see SCRUM_MASTER_ENTRY_DISPATCH_REF in src/lib/routing_helper.ts).
name: "[Reusable] Scrum Master (Jira)"

on:
  workflow_call:
    inputs:
      limit:
        description: "Global max issues per sm_dispatch_rule step (1–50)"
        required: false
        type: string
        default: '10'
      jira_project:
        description: "Replaces {jiraProject} in step JQL"
        required: false
        type: string
        default: ''
      ticket_context_depth:
        description: "0=primary only; 1=linked issues+subtasks"
        required: false
        type: string
        default: '1'
    secrets:
      JIRA_BASE_URL:
        required: true
      JIRA_EMAIL:
        required: true
      JIRA_API_TOKEN:
        required: true
      COPILOT_PAT:
        required: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      actions: write
    steps:
      # ── Step 1: Checkout calling (consumer) repo at workspace root ──────
      - name: Checkout consumer repo
        uses: actions/checkout@v4

      # ── Step 2: Checkout SDLCAgents for Node scripts ────────────────────
      - name: Checkout SDLCAgents (scripts)
        uses: actions/checkout@v4
        with:
          repository: DmitryLukyanov/SDLCAgents
          ref: master
          path: .sdlc-agents
          token: ${{ secrets.COPILOT_PAT }}

      # ── Step 3: Node setup + install ────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: .sdlc-agents/package-lock.json

      - name: Install SDLCAgents dependencies
        run: npm ci
        working-directory: .sdlc-agents

      # ── Step 4: Upload Scrum Master config artifact ───────────────────────
      - name: Upload Scrum Master config artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrum-master-config
          path: config/workflows/scrum-master/scrum-master.config
          if-no-files-found: error

      # ── Step 5: Run Scrum Master (CWD = consumer workspace root) ────────
      # Scripts run from .sdlc-agents/ but process.cwd() = workspace root.
      # JQL and agent paths come only from config/workflows/scrum-master/scrum-master.config (PIPELINE_CONFIG_FILE or RULES_FILE).
      - name: Run Scrum Master
        run: .sdlc-agents/node_modules/.bin/tsx .sdlc-agents/src/workflows/scrum-master/scrum-master.ts
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          RULES_FILE: config/workflows/scrum-master/scrum-master.config
          GLOBAL_LIMIT: ${{ inputs.limit }}
          JIRA_PROJECT: ${{ inputs.jira_project }}
          TICKET_CONTEXT_DEPTH: ${{ inputs.ticket_context_depth }}
