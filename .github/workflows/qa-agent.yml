name: QA Agent

on:
  pull_request:

jobs:
  qa-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - uses: ./actions/qa-agent
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
