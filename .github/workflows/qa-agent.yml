name: QA Agent

on:
  pull_request:

jobs:
  qa-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
      - run: npm run build

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare PR context
        uses: ./actions/qa-agent
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          step: prepare
          pr-context-file: claude-work/pr-context.json

      - name: Generate testcases
        uses: ./actions/claude-cli
        with:
          pr-context-file: claude-work/pr-context.json
          input-file: claude-work/input.txt
          output-file: claude-work/output.json
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload Claude generate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-generate
          path: |
            claude-work/input.txt
            claude-work/output.json

      - name: Validate testcases
        id: validate
        uses: ./actions/qa-agent
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          step: validate
          claude-output-file: claude-work/output.json

      - name: Repair testcases
        if: steps.validate.outputs.valid == 'false'
        uses: ./actions/claude-cli
        with:
          pr-context-file: claude-work/pr-context.json
          input-file: claude-work/input-repair.txt
          output-file: claude-work/output.json
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          validation-errors: ${{ steps.validate.outputs.errors }}

      - name: Upload Claude repair artifacts
        if: steps.validate.outputs.valid == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: claude-repair
          path: |
            claude-work/input-repair.txt
            claude-work/output.json

      - name: Build calculator
        working-directory: calculator
        run: |
          npm ci
          npm run build

      - name: Start calculator preview
        working-directory: calculator
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4173/SDLCAgents/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "calculator preview did not start"
          exit 1

      - name: Run testcases
        uses: ./actions/qa-agent
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          step: run
          claude-output-file: claude-work/output.json
          results-file: claude-work/results.json
          screenshot-dir: claude-work/screenshots
          log-file: claude-work/run.log
          base-url: ${{ vars.STAGING_URL }}

      - name: Upload runner artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runner-results
          path: |
            claude-work/results.json
            claude-work/run.log
            claude-work/screenshots

      - name: Publish screenshots for summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pngs=("$GITHUB_WORKSPACE"/claude-work/screenshots/*.png)
          if [ ${#pngs[@]} -eq 0 ]; then
            echo "No screenshots to publish"
            exit 0
          fi
          workdir="$(mktemp -d)"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init "$workdir"
          cd "$workdir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "$remote"
          if git fetch --depth 1 origin qa-screenshots; then
            git checkout -b qa-screenshots FETCH_HEAD
          else
            git checkout --orphan qa-screenshots
          fi
          mkdir -p "$GITHUB_RUN_ID"
          cp "${pngs[@]}" "$GITHUB_RUN_ID/"
          git add "$GITHUB_RUN_ID"
          git commit -m "QA screenshots for run ${GITHUB_RUN_ID}"
          git push origin HEAD:qa-screenshots

      - name: Publish comment
        uses: ./actions/qa-agent
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          step: publish
          claude-output-file: claude-work/output.json
          results-file: claude-work/results.json
