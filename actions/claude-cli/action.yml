name: Claude CLI
description: Runs Claude Code CLI for readonly testcase generation
author: SDLCAgents

inputs:
  pr-context-file:
    description: Path to PR context JSON used to build the Claude prompt
    required: true
  input-file:
    description: Path where the built Claude prompt will be written (upload as artifact)
    required: true
  output-file:
    description: Path where Claude result text will be written (upload as artifact)
    required: true
  anthropic-api-key:
    description: Anthropic API key for Claude Code CLI
    required: true

outputs:
  input-file:
    description: Path to the written Claude prompt file
  output-file:
    description: Path to the written Claude result file

runs:
  using: node20
  main: ../../dist/claude-cli/index.js
